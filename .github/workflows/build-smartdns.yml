name: Build SmartDNS APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartdns-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build SmartDNS APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@07976c6290703d34c16d382cb36445f98bb43b1f # v3.2.0
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Create .env file
        shell: bash
        run: |
          cp .env.example .env
          echo "GEMINI_API_KEY=placeholder" >> .env

      - name: Generate a throwaway release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore ci-release.keystore -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass smartdns-ci -keypass smartdns-ci \
            -dname "CN=SmartDNS CI, OU=Test, O=SmartDNS, L=Phnom Penh, C=KH"
          echo "KEYSTORE_PATH=$PWD/ci-release.keystore" >> $GITHUB_ENV
          echo "STORE_PASSWORD=smartdns-ci" >> $GITHUB_ENV
          echo "KEY_PASSWORD=smartdns-ci" >> $GITHUB_ENV

      - name: Unit tests and release APK build
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain \
            testDebugUnitTest assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            > gradle-output.log 2>&1
          code=$?
          tail -120 gradle-output.log
          if (( code != 0 )); then
            python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          lines = open('gradle-output.log', encoding='utf-8', errors='replace').read().splitlines()
          selected = [l for l in lines if re.search(r'error:|Error:|FAILED|What went wrong|Execution failed|Caused by:|Could not|requires|Unsupported|not found|Exception', l)]
          for path in glob.glob('app/build/test-results/**/TEST-*.xml', recursive=True):
              try:
                  for case in ET.parse(path).getroot().iter('testcase'):
                      for failure in list(case.findall('failure')) + list(case.findall('error')):
                          selected.append(case.get('classname','') + '.' + case.get('name','') + ': ' + failure.get('message',''))
              except ET.ParseError:
                  pass
          if not selected: selected = lines[-30:]
          for line in selected[:40]:
              line = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + line[:900])
          PY
          fi
          exit "$code"

      - name: Enforce per-APK limit and name split release APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          limit=120000000
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*-release.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "::error::No release APKs were produced."
            exit 1
          fi
          {
            echo "## SmartDNS release APKs (one per ABI)"
            echo "Install only the file that matches your phone."
            echo ""
            echo "| ABI | Size (bytes) | Size (MB) | SHA-256 |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for apk in "${apks[@]}"; do
            base=$(basename "$apk" .apk)
            abi=${base#app-}; abi=${abi%-release}
            size=$(stat -c%s "$apk")
            if (( size > limit )); then
              echo "::error::$abi APK is $size bytes; the per-APK limit is $limit bytes."
              exit 1
            fi
            out="artifacts/SmartDNS-${abi}.apk"
            cp "$apk" "$out"
            (cd artifacts && sha256sum "SmartDNS-${abi}.apk" > "SmartDNS-${abi}.apk.sha256")
            sha=$(cut -d' ' -f1 "artifacts/SmartDNS-${abi}.apk.sha256")
            echo "::notice::SMARTDNS_APK_${abi}_BYTES=$size"
            echo "::notice::SMARTDNS_APK_${abi}_SHA256=$sha"
            echo "| $abi | $size | $(( size / 1000000 )) | \`$sha\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo ""
            echo "- Build: **release** (minified), self-signed CI test key."
            echo "- Per-APK limit: $limit bytes (120 MB)."
            echo "- Download the artifact for your ABI below."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SmartDNS APK (arm64-v8a)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SmartDNS-APK-arm64-v8a
          path: |
            artifacts/SmartDNS-arm64-v8a.apk
            artifacts/SmartDNS-arm64-v8a.apk.sha256
        if: success()

      - name: Upload SmartDNS APK (armeabi-v7a)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SmartDNS-APK-armeabi-v7a
          path: |
            artifacts/SmartDNS-armeabi-v7a.apk
            artifacts/SmartDNS-armeabi-v7a.apk.sha256
        if: success()

      - name: Upload SmartDNS APK (x86_64)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SmartDNS-APK-x86_64
          path: |
            artifacts/SmartDNS-x86_64.apk
            artifacts/SmartDNS-x86_64.apk.sha256
        if: success()

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SmartDNS-test-reports
          path: |
            gradle-output.log
            app/build/reports/
            app/build/test-results/
        if-no-files-found: ignore

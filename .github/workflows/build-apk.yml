name: Build Xtr3 APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xtr3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@07976c6290703d34c16d382cb36445f98bb43b1f # v3.2.0
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Test browser detector and source observer
        run: node --test tests/*.cjs

      - name: Unit tests, lint, and APK build
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain testDebugUnitTest lintDebug assembleDebug > gradle-output.log 2>&1
          code=$?
          tail -120 gradle-output.log
          if (( code != 0 )); then
            python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          lines = open('gradle-output.log', encoding='utf-8', errors='replace').read().splitlines()
          selected = [l for l in lines if re.search(r'error:|Error:|FAILED|What went wrong|Execution failed|Caused by:|Could not|requires|Unsupported|not found|Exception', l)]
          for path in glob.glob('app/build/test-results/**/TEST-*.xml', recursive=True):
              try:
                  for case in ET.parse(path).getroot().iter('testcase'):
                      for failure in list(case.findall('failure')) + list(case.findall('error')):
                          selected.append(case.get('classname','') + '.' + case.get('name','') + ': ' + failure.get('message',''))
              except ET.ParseError:
                  pass
          if not selected: selected = lines[-30:]
          for line in selected[:40]:
              line = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + line[:900])
          PY
          fi
          exit "$code"

      - name: Enforce 250 MB limit and name APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$source_apk"
          size=$(stat -c%s "$source_apk")
          limit=250000000
          if (( size > limit )); then
            echo "::error::Xtr3.apk is $size bytes; the limit is $limit bytes."
            exit 1
          fi
          cp "$source_apk" artifacts/Xtr3.apk
          (cd artifacts && sha256sum Xtr3.apk > Xtr3.apk.sha256)
          echo "::notice::XTR3_APK_BYTES=$size"
          echo "::notice::XTR3_APK_SHA256=$(cut -d' ' -f1 artifacts/Xtr3.apk.sha256)"
          {
            echo "## Xtr3 APK"
            echo "- Size: $size bytes ($(( size / 1024 )) KiB)"
            echo "- Limit: $limit bytes (250 MB)"
            echo "- Build: debug-signed, installable test APK"
            echo "- Download: the **Xtr3-APK** artifact below"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Xtr3 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Xtr3-APK
          path: |
            artifacts/Xtr3.apk
            artifacts/Xtr3.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Xtr3-test-reports
          path: |
            gradle-output.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

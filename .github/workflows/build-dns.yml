name: Build DNS Server APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build DNS Server APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@07976c6290703d34c16d382cb36445f98bb43b1f # v3.2.0
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Debug environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ls $ANDROID_HOME/platforms/ 2>&1 || echo "No platforms dir"
          ls $ANDROID_HOME/build-tools/ 2>&1 || echo "No build-tools dir"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate a throwaway release signing key
        shell: bash
        run: |
          keytool -genkeypair -v -keystore ci-release.keystore -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass dns-ci-release -keypass dns-ci-release \
            -dname "CN=DNS Server CI, OU=Test, O=DNS Server, L=Phnom Penh, C=KH"
          echo "KEYSTORE_PATH=$PWD/ci-release.keystore" >> $GITHUB_ENV
          echo "STORE_PASSWORD=dns-ci-release" >> $GITHUB_ENV
          echo "KEY_ALIAS=upload" >> $GITHUB_ENV
          echo "KEY_PASSWORD=dns-ci-release" >> $GITHUB_ENV

      - name: Build release APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            > build-output.log 2>&1
          code=$?
          echo "::group::Gradle build output (exit code: $code)"
          cat build-output.log
          echo "::endgroup::"
          exit $code

      - name: Surface Gradle errors
        if: always()
        shell: bash
        run: |
          if [ -f build-output.log ]; then
            grep -iE 'error|FAILED|What went wrong|Execution failed|Caused by:|Could not|Exception|problem occurred|^\s*e:|^\s*w:|unresolved|cannot find|cannot access|overrides nothing|not abstract' build-output.log | head -30 | while read line; do
              echo "::error::${line:0:900}"
            done
            # Also show last 50 lines for context
            echo "::group::Last 50 lines of build output"
            tail -50 build-output.log
            echo "::endgroup::"
          fi

      - name: Split APKs by ABI
        shell: bash
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*-release.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "::error::No release APKs were produced."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            base=$(basename "$apk" .apk)
            abi=${base#app-}; abi=${abi%-release}
            cp "$apk" "artifacts/DNS-${abi}.apk"
          done

      - name: Upload DNS APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DNS-APKs
          path: artifacts/*.apk
          retention-days: 14
        if: success()

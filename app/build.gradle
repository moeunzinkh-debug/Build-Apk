plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xtr3.downloader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xtr3.downloader'
        minSdk 29
        targetSdk 35
        versionCode 13
        versionName '1.6.0'
        resourceConfigurations += ['en', 'km']
        // ABI selection lives in splits.abi below; ndk.abiFilters must not also be set.
    }

    // One installable APK per CPU architecture so a phone downloads only the
    // native engines it can actually run (Python/QuickJS/FFmpeg/Cronet). This is
    // what keeps a single installed APK near ~50-65 MB instead of ~167 MB.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }

    signingConfigs {
        // CI passes a throwaway self-signed keystore via -Pandroid.injected.signing.*.
        // Locally (no properties) we fall back to the debug key so assembleRelease
        // still produces an installable APK. Never commit a real keystore here.
        ciRelease {
            def storePath = providers.gradleProperty('android.injected.signing.store.file').orNull
            if (storePath != null) {
                storeFile file(storePath)
                storePassword providers.gradleProperty('android.injected.signing.store.password').orNull
                keyAlias providers.gradleProperty('android.injected.signing.key.alias').orNull
                keyPassword providers.gradleProperty('android.injected.signing.key.password').orNull
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            // Minified, resource-shrunk, non-debuggable release. The workflow signs it
            // with a CI-generated self-signed key (injected signing properties). For a
            // Play Store / stable-upgrade release, supply your own private keystore.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig(signingConfigs.ciRelease.storeFile != null ? signingConfigs.ciRelease : signingConfigs.debug)
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        // youtubedl-android executes its bundled Python/FFmpeg/QuickJS binaries.
        jniLibs { useLegacyPackaging = true }
    }
    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}

dependencies {
    // Backports document-start scripts to older Android System WebView releases.
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
    // Real bundled Chromium network stack for media transfers (HTTP/2 + QUIC), with a
    // platform HttpURLConnection fallback. This is functional weight, not padding.
    implementation 'org.chromium.net:cronet-embedded:141.7340.3'
    // In-app playback of saved videos and media3 container/track support.
    implementation 'androidx.media3:media3-exoplayer:1.8.1'
    implementation 'androidx.media3:media3-ui:1.8.1'
    // Site-aware public-video extraction + lossless stream merging. GPLv3; see LICENSES.md.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for local JVM tests of the quality menu; Android supplies it at runtime.
    testImplementation 'org.json:json:20240303'
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xtr3.downloader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xtr3.downloader'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        resourceConfigurations += ['en', 'km']
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            // The workflow produces an installable, debug-signed test APK.
            // Add your own private signing configuration before publishing a release.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

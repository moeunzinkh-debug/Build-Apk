plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xtr3.downloader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xtr3.downloader'
        minSdk 29
        targetSdk 35
        versionCode 9
        versionName '1.3.0'
        resourceConfigurations += ['en', 'km']
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            // The workflow produces an installable, debug-signed test APK.
            // Add your own private signing configuration before publishing a release.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        // youtubedl-android executes its bundled Python/FFmpeg/QuickJS binaries.
        jniLibs { useLegacyPackaging = true }
    }
    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}

dependencies {
    // Backports document-start scripts to older Android System WebView releases.
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
    // Real bundled Chromium network stack for media transfers (HTTP/2 + QUIC), with a
    // platform HttpURLConnection fallback. This is functional weight, not padding.
    implementation 'org.chromium.net:cronet-embedded:141.7340.3'
    // In-app playback of saved videos and media3 container/track support.
    implementation 'androidx.media3:media3-exoplayer:1.8.1'
    implementation 'androidx.media3:media3-ui:1.8.1'
    // Site-aware public-video extraction + lossless stream merging. GPLv3; see LICENSES.md.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    testImplementation 'junit:junit:4.13.2'
}
